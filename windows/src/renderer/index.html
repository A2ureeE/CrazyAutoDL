<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>胡闹AutoDL</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-dashboard" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="2.6"></circle>
      <path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3"></path>
      <path d="M5.5 5.5a9.2 9.2 0 0 1 13 0M18.5 18.5a9.2 9.2 0 0 1-13 0"></path>
    </symbol>
    <symbol id="icon-instances" viewBox="0 0 24 24">
      <rect x="3.5" y="4" width="17" height="6" rx="2"></rect>
      <rect x="3.5" y="14" width="17" height="6" rx="2"></rect>
      <path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"></path>
    </symbol>
    <symbol id="icon-billing" viewBox="0 0 24 24">
      <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <path d="M4 6h7M15 6h5M4 12h3M11 12h9M4 18h10M18 18h2"></path>
      <circle cx="13" cy="6" r="2"></circle>
      <circle cx="9" cy="12" r="2"></circle>
      <circle cx="16" cy="18" r="2"></circle>
    </symbol>
    <symbol id="icon-star" viewBox="0 0 24 24">
      <path d="m12 3.4 2.7 5.5 6 .9-4.35 4.24 1.03 6-5.38-2.83-5.38 2.83 1.03-6L3.3 9.8l6-.9L12 3.4Z" fill="currentColor" stroke="none"></path>
    </symbol>
    <symbol id="icon-github" viewBox="0 0 24 24">
      <path d="M9 19.5c-4.2 1.4-4.2-2.3-6-2.8M15 21.5v-3.4a3 3 0 0 0-.8-2.3c2.7-.3 5.5-1.3 5.5-6a4.7 4.7 0 0 0-1.3-3.2 4.4 4.4 0 0 0-.1-3.3s-1-.3-3.4 1.3a11.6 11.6 0 0 0-6.1 0C6.5 2.7 5.5 3 5.5 3a4.4 4.4 0 0 0-.1 3.3 4.7 4.7 0 0 0-1.3 3.2c0 4.7 2.8 5.7 5.5 6a3 3 0 0 0-.8 2.3v3.4"></path>
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24">
      <path d="M20 11a8 8 0 1 0-.7 4.4M20 4.5V11h-6.5"></path>
    </symbol>
    <symbol id="icon-power" viewBox="0 0 24 24">
      <path d="M12 3v8"></path>
      <path d="M7.2 6.3a8 8 0 1 0 9.6 0"></path>
    </symbol>
    <symbol id="icon-play" viewBox="0 0 24 24">
      <path d="M7 4.8 19 12 7 19.2V4.8Z"></path>
    </symbol>
    <symbol id="icon-stop" viewBox="0 0 24 24">
      <rect x="6" y="6" width="12" height="12" rx="2"></rect>
    </symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24">
      <rect x="9" y="9" width="11" height="11" rx="2"></rect>
      <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"></path>
    </symbol>
    <symbol id="icon-external" viewBox="0 0 24 24">
      <path d="M14 4h6v6M20 4l-9 9"></path>
      <path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"></path>
    </symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24">
      <path d="m6 9 6 6 6-6"></path>
    </symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24">
      <path d="m9 6 6 6-6 6"></path>
    </symbol>
    <symbol id="icon-arrow-up-right" viewBox="0 0 24 24">
      <path d="M7 17 17 7M8 7h9v9"></path>
    </symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
      <path d="M10 21h4"></path>
    </symbol>
    <symbol id="icon-wallet" viewBox="0 0 24 24">
      <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18a2 2 0 0 1 2 2v12H6a2 2 0 0 1-2-2V7.5Z"></path>
      <path d="M4 8h13M15 13h5"></path>
      <circle cx="16.5" cy="13" r=".6" fill="currentColor"></circle>
    </symbol>
    <symbol id="icon-gauge" viewBox="0 0 24 24">
      <path d="M4 18a8 8 0 1 1 16 0"></path>
      <path d="m12 14 4-5"></path>
      <path d="M4 18h.01M20 18h.01M12 18h.01"></path>
    </symbol>
    <symbol id="icon-memory" viewBox="0 0 24 24">
      <rect x="6" y="6" width="12" height="12" rx="2"></rect>
      <path d="M9 2.5v3.5M15 2.5v3.5M9 18v3.5M15 18v3.5M2.5 9H6M2.5 15H6M18 9h3.5M18 15h3.5"></path>
      <rect x="10" y="10" width="4" height="4" rx="1"></rect>
    </symbol>
    <symbol id="icon-storage" viewBox="0 0 24 24">
      <rect x="3" y="3.5" width="18" height="7" rx="2"></rect>
      <rect x="3" y="13.5" width="18" height="7" rx="2"></rect>
      <path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"></path>
    </symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M12 7v5l3.2 2"></path>
    </symbol>
    <symbol id="icon-map-pin" viewBox="0 0 24 24">
      <path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11Z"></path>
      <circle cx="12" cy="10" r="2.5"></circle>
    </symbol>
    <symbol id="icon-server" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="6" rx="2"></rect>
      <rect x="3" y="14" width="18" height="6" rx="2"></rect>
      <path d="M7 7h.01M7 17h.01"></path>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="m8 12.2 2.6 2.6L16.5 9"></path>
    </symbol>
    <symbol id="icon-alert" viewBox="0 0 24 24">
      <path d="M12 3 2.8 20h18.4L12 3Z"></path>
      <path d="M12 9v4.5M12 17h.01"></path>
    </symbol>
    <symbol id="icon-error" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="m9 9 6 6M15 9l-6 6"></path>
    </symbol>
    <symbol id="icon-info" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M12 11v5M12 8h.01"></path>
    </symbol>
    <symbol id="icon-x" viewBox="0 0 24 24">
      <path d="m6 6 12 12M18 6 6 18"></path>
    </symbol>
    <symbol id="icon-bolt" viewBox="0 0 24 24">
      <path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5Z"></path>
    </symbol>
    <symbol id="icon-undo" viewBox="0 0 24 24">
      <path d="M9 14 4 9l5-5"></path>
      <path d="M4 9h10a6 6 0 0 1 0 12h-3"></path>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M12 8v8M8 12h8"></path>
    </symbol>
    <symbol id="icon-download" viewBox="0 0 24 24">
      <path d="M12 3v12M7 10l5 5 5-5"></path>
      <path d="M4 20h16"></path>
    </symbol>
    <symbol id="icon-key" viewBox="0 0 24 24">
      <circle cx="8" cy="15" r="4"></circle>
      <path d="m11 12 9-9M17 6l3 3M14 9l2 2"></path>
    </symbol>
    <symbol id="icon-logout" viewBox="0 0 24 24">
      <path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5"></path>
      <path d="M14 8l4 4-4 4M8 12h10"></path>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24">
      <path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13"></path>
      <path d="M10 11v5M14 11v5"></path>
    </symbol>
    <symbol id="icon-loader" viewBox="0 0 24 24">
      <path d="M12 3a9 9 0 1 0 9 9"></path>
    </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path d="M12 3 4.5 6v6c0 4.5 3.2 7.8 7.5 9 4.3-1.2 7.5-4.5 7.5-9V6L12 3Z"></path>
      <path d="m9 12 2 2 4-4"></path>
    </symbol>
    <symbol id="icon-scope" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="7"></circle>
      <path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path>
      <circle cx="12" cy="12" r="1.4" fill="currentColor"></circle>
    </symbol>
    <symbol id="icon-wifi" viewBox="0 0 24 24">
      <path d="M4 9a12 12 0 0 1 16 0M7 12.5a8 8 0 0 1 10 0M10 16a4 4 0 0 1 4 0"></path>
      <circle cx="12" cy="19" r=".8" fill="currentColor"></circle>
    </symbol>
    <symbol id="icon-google" viewBox="0 0 24 24">
      <path d="M20.5 12.2c0-.7-.1-1.3-.2-1.9H12v3.7h4.8a4.2 4.2 0 0 1-1.8 2.7v2.3h2.9c1.7-1.6 2.6-3.9 2.6-6.8Z"></path>
      <path d="M12 21c2.4 0 4.4-.8 5.9-2.1l-2.9-2.3c-.8.6-1.9.9-3 .9-2.3 0-4.3-1.6-5-3.7H4v2.4A9 9 0 0 0 12 21Z"></path>
      <path d="M7 13.8a5.4 5.4 0 0 1 0-3.5V7.8H4a9 9 0 0 0 0 8.3l3-2.3Z"></path>
      <path d="M12 6.6c1.3 0 2.5.4 3.4 1.3l2.6-2.6A9 9 0 0 0 4 7.8l3 2.5c.7-2.1 2.7-3.7 5-3.7Z"></path>
    </symbol>
  </svg>

  <div class="titlebar">
    <div class="titlebar-brand">
      <img src="../../assets/brand.png" alt="" draggable="false" />
      <span class="titlebar-name">胡闹AutoDL</span>
      <span class="titlebar-demo" id="titlebar-demo" hidden>演示模式</span>
    </div>
    <div class="titlebar-status" id="titlebar-status">
      <i class="status-dot"></i>
      <span>正在启动</span>
    </div>
  </div>

  <div class="app-body" id="app-body">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <img src="../../assets/brand.png" alt="胡闹AutoDL" draggable="false" />
        </div>
        <div class="brand-copy">
          <strong>胡闹AutoDL</strong>
          <span>GPU SENTINEL</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item" type="button" data-action="nav" data-section="dashboard">
          <svg class="icon"><use href="#icon-dashboard"></use></svg>
          <span>监控台</span>
          <span class="nav-hint">LIVE</span>
        </button>
        <button class="nav-item" type="button" data-action="nav" data-section="instances">
          <svg class="icon"><use href="#icon-instances"></use></svg>
          <span>我的实例</span>
          <span class="nav-count" id="nav-instance-count">0</span>
        </button>
        <button class="nav-item" type="button" data-action="nav" data-section="billing">
          <svg class="icon"><use href="#icon-billing"></use></svg>
          <span>账单</span>
        </button>
        <button class="nav-item" type="button" data-action="nav" data-section="settings">
          <svg class="icon"><use href="#icon-settings"></use></svg>
          <span>设置</span>
          <span class="nav-badge" id="settings-update-badge" hidden>NEW</span>
        </button>
      </nav>

      <div class="sidebar-spacer"></div>

      <div class="star-card">
        <div class="star-card-title">
          <svg class="icon star-fill"><use href="#icon-star"></use></svg>
          <span>用爱发电</span>
        </div>
        <p>如果它替你抢到过显卡，去 GitHub 点个 Star 吧。</p>
        <button class="btn primary sm block" type="button" data-action="open-repo">
          <svg class="icon"><use href="#icon-github"></use></svg>
          Star on GitHub
        </button>
      </div>

      <div class="sidebar-footer">
        <span>作者 A2ureeE · <span id="sidebar-version">v1.2.0</span></span>
        <button type="button" class="link-button" data-action="open-repo">
          CrazyAutoDL
          <svg class="icon"><use href="#icon-external"></use></svg>
        </button>
      </div>
    </aside>

    <main class="main-scroll" id="main-scroll">
      <div id="view-root" class="view-root"></div>
    </main>
  </div>

  <div class="toast-root" id="toast-root" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
